name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --project-name moneymind .
      # flutter create adds a sample test for MyApp; this app's widget is MoneyMind.
      - run: rm -f test/widget_test.dart
      # Configure the registered application ID and native payment-notification bridge.
      - run: python3 tool/configure_android.py
      # Use the permanent release key; do not publish a temporary/debug-signed artifact.
      - name: Configure release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::One or more release-signing secrets are missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/moneymind-release.jks
          test -s android/app/moneymind-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=moneymind-release.jks
          EOF
          python3 tool/configure_android.py
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Verify release APK certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          CERT_SHA="$( "$APKSIGNER" verify --print-certs "$APK" | awk '/certificate SHA-256 digest:/ {print $NF; exit}' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]' )"
          EXPECTED_SHA="FB6EB92AC64C61E79B5C4BC7C78023ED332392A04A4B713E4FEDB3629EB8761B"
          if [ -z "$CERT_SHA" ]; then
            echo "::error::Could not read the APK signing certificate SHA-256."
            exit 1
          fi
          if [ "$CERT_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::APK signing certificate does not match the certificate registered for MoneyMind."
            echo "Expected registered SHA-256: $EXPECTED_SHA"
            echo "Actual APK SHA-256: $CERT_SHA"
            exit 1
          fi
          echo "Verified: APK signing certificate matches the registered MoneyMind certificate."
      - uses: actions/upload-artifact@v4
        with:
          name: moneymind-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
